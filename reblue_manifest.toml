[project]
sdk_version = "0.10.0"
name = "reblue"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated"
includes = [
  "config/functions.toml",
  "config/hooks/battle.toml",
  "config/hooks/crt.toml",
  "config/hooks/cutscene.toml",
  "config/hooks/disc_io.toml",
  "config/hooks/encyclopedia_menu.toml",
  "config/hooks/frame_interp.toml",
  "config/hooks/guest_census.toml",
  "config/hooks/guest_debug.toml",
  "config/hooks/hud_anchor.toml",
  "config/hooks/hud_fade.toml",
  "config/hooks/mouse_cursor.toml",
  "config/hooks/output_resolution.toml",
  "config/hooks/physical_buffers.toml",
  "config/hooks/pso_predictor.toml",
  "config/hooks/render_tweaks.toml",
  "config/hooks/save.toml",
  "config/hooks/stereo.toml",
  "config/hooks/title_menu.toml",
  "config/hooks/tutorials.toml",
]

setjmp_address = 0x826C5D00
longjmp_address = 0x826C5AB0

skip_lr = true
ctr_as_local = true
xer_as_local = true
cr_as_local = true

# The safe 96.7% of what non_argument_as_local would have given us.
#
# That flag is four independent changes wearing one name, and it is disabled
# below because it kills the guest's IO path 0.2s after the VFS mounts. Counted
# over generated/: r11 is 632,902 ctx accesses (85.1% of the flag's value) with
# 16 functions that textually read it before writing it, and f0 is 85,929
# (11.6%) with none. r12 is 22,833 (3.1%) with 6,208 such functions - and its
# hazard has a named cause, `mflr r12` emitted as a comment under skip_lr, so
# the next instruction reads a register nothing wrote.
#
# So r11 and f0 land and r12 stays out. Each is independently switchable, which
# is what makes the remaining risk bisectable instead of all-or-nothing.
scratch_r11_as_local = true
scratch_f0_as_local = true
reserved_as_local = true
non_volatile_as_local = true
# non_argument_as_local: DO NOT ENABLE as a whole - see scratch_r11/f0 above,
# which land 96.7% of its value safely. The combined flag still miscompiles.
#
# Enabling it cuts ctx. accesses across generated/ by 36% (2,049,797 ->
# 1,306,101), which looked like a large free win. It is not: on device the game
# dies during startup, 0.2s after the VFS mounts, with
#
#   [disc] file-load fatal, failed file: '<unknown>'
#
# and no preceding read failure, so the guest's own IO path is being
# miscompiled rather than a file actually being missing. Bisected by building
# with and without it against identical game data - without it the game reaches
# a field scene, with it it never gets past startup.
#
# non_volatile_as_local stays on and is fine; it has shipped all along.
# non_argument_as_local = true

