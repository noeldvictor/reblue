# Cull bias (bd_cull_bias), body in src/engine/guest_census.cpp.
#
# bdSceneNodeCullTraverse (0x82282490) is the guest's own scene-graph cull, and
# it is the only caller of bdSceneNodeDrawSingle that matters - the function the
# census names as the top CPU consumer at 420 calls a frame. Its shape is:
#
#   lfs   f13,44(r29)      ; radius scale for this view
#   lfs   f0,32(r30)       ; the node's bounding radius
#   fmuls f1,f13,f0        ; f1 = world radius
#   bl    0x82287788       ; visibility test -> r3       <- hooked here
#   cmpwi r3,0
#   beq   0x822825E0       ; not visible: skip the draw
#   ...
#   bl    0x8227FEE8       ; bdSceneNodeDrawSingle
#
# Hooking before the call and scaling f1 makes the guest's own test stricter,
# so marginal nodes fail it and the guest skips their draw by itself. No control
# flow is redirected and no return address has to be found, which is what makes
# this safe: the alternative, forcing r3 after the test, needs f1 to have
# survived a call that is free to clobber it.

[[midasm_hook]]
address = 0x82282598
name = "bdSceneCullBiasHook"
registers = ["f1", "r3"]
after_instruction = false

# Distance culling (bd_cull_distance). The pair above computes the decision from
# the node centre, which r3 points at and which is in view space with the camera
# at the origin - measured on device: z sits near -700 for mid-distance props and
# lengths run 700-820. This one applies it, by zeroing the visibility result the
# guest is about to test.
#
# Two hooks rather than one because the centre is only reachable before the call
# and the result only after it. Forcing r3 here is what makes it safe: no control
# flow is redirected and the guest skips the draw on its own path.
[[midasm_hook]]
address = 0x8228259C
name = "bdSceneCullDistanceHook"
registers = ["r3"]
after_instruction = false

# The second path to bdSceneNodeDrawSingle, and the one that carries most of the
# 2084 calls a frame. sub_82282608 sits immediately after bdSceneNodeCullTraverse
# (0x82282490 + 0x178) and is its sibling: the same shape, a different visibility
# test, and the node centre in r4 rather than r3.
#
#   addi r4,r1,80        ; r4 = the transformed centre    <- 0x82282754
#   fmr   f1,f7          ; f1 = the world radius          <- 0x82282758
#   bl    0x82392EC8     ; visibility test -> r3          <- 0x8228275C
#   cmpwi r3,0                                            <- 0x82282760
#   beq   0x82282780     ; not visible: skip the draw
#   ...
#   bl    0x8227FEE8     ; bdSceneNodeDrawSingle          <- 0x8228277C
#
# Addresses counted back from loc_82282780, which follows the draw call.
# Culling only the first path left the draw count unmoved, which read as a
# broken hook and was really the wrong population.

[[midasm_hook]]
address = 0x8228275C
name = "bdSceneCullBiasHook2"
registers = ["f1", "r4"]
after_instruction = false

[[midasm_hook]]
address = 0x82282760
name = "bdSceneCullDistanceHook"
registers = ["r3"]
after_instruction = false
