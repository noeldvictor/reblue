# Rendering the guest's scene more than once per frame (bodies in
# src/xr/xr_stereo.cpp).
#
# bdCameraRender (0x82142D30) is the per-view scene render. Its two call sites
# were found by reading the recompiled source rather than a disassembler -
# generated/reblue_recomp.34.cpp around line 12235 - where the surrounding
# block is an if/else that renders the same camera (r31) either side:
#
#   mr r3,r31 ; bl 0x82142d30   <- 0x822D3C34, the branch that also runs
#                                  sub_82173DF8 before and after
#   ...
#   loc_822D3C4C:
#   mr r3,r31 ; bl 0x82142d30   <- 0x822D3C50, the plain branch
#
# Hooked after the instruction, so the first render has completed and the guest
# state it left behind is what the second one starts from.

[[midasm_hook]]
address = 0x822D3C34
name = "bdStereoSecondViewHook"
registers = ["r31"]
after_instruction = true

[[midasm_hook]]
address = 0x822D3C50
name = "bdStereoSecondViewHook"
registers = ["r31"]
after_instruction = true

# The camera's view and projection, at the point the engine sets them.
#
# bdCameraViewSetMatrices (0x82135228) calls these two in turn, and
# config/functions.toml already names them: bdCameraViewSetMatrix is the view,
# bdCameraViewSetProjMatrix is the projection. r5 is the source matrix in both
# cases - 16 floats of guest-endian data.
#
# This is the seam correct per-eye stereo belongs on. The clip-space skew in
# DispatchDraw works but is empirical: it shears whatever transform occupies VS
# register 32, which is the identity for many draws and an affine matrix with a
# 0.041 scale for others, and is certainly not a view-projection.

[[midasm_hook]]
address = 0x821351A8
name = "bdCameraProjMatrixHook"
registers = ["r5"]
after_instruction = false
